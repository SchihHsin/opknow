<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" role="img" aria-label="Agent 面向技术知识生态形成答案的证据循环">
  <title>Agent 面向技术知识生态形成答案的证据循环</title>
  <desc>Agent 解析开发任务后，可通过搜索与抓取获取官方和第三方资料，或使用模型自带知识；随后判断证据是否充分，继续检索或基于证据收敛为终答。证据耗尽而仍不充分时存在凭记忆填补空缺的风险。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a8a"/></marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2a7a68"/></marker>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#D0454F"/></marker>
  </defs>
  <g font-family="Arial, 'Noto Sans CJK SC', sans-serif">
    <rect x="190" y="14" width="180" height="30" rx="8" fill="#f4f5f8" stroke="#d8dae0"/><text x="280" y="34" text-anchor="middle" font-size="12" fill="#333">开发任务 / 用户问句</text>
    <rect x="170" y="52" width="220" height="36" rx="8" fill="#f4f5f8" stroke="#d8dae0"/><text x="280" y="69" text-anchor="middle" font-size="11" fill="#333">组装任务上下文</text><text x="280" y="82" text-anchor="middle" font-size="9" fill="#888">约束、历史与当前问句</text>
    <rect x="205" y="98" width="150" height="28" rx="8" fill="#ECE7F6" stroke="#b9abe0"/><text x="280" y="116" text-anchor="middle" font-size="11" fill="#4a3f9e">① 意图解析</text>
    <rect x="205" y="134" width="150" height="28" rx="8" fill="#ECE7F6" stroke="#b9abe0"/><text x="280" y="152" text-anchor="middle" font-size="11" fill="#4a3f9e">② 子目标拆解</text>
    <rect x="196" y="170" width="168" height="32" rx="8" fill="#ECE7F6" stroke="#b9abe0"/><text x="280" y="190" text-anchor="middle" font-size="11" fill="#4a3f9e">③ 路由：检索 / 抓取 / 直接作答</text>
    <polygon points="280,212 348,238 280,264 212,238" fill="#FCEFC7" stroke="#8a6d1a"/><text x="280" y="236" text-anchor="middle" font-size="10" fill="#8a6d1a">是否需要检索？</text><text x="280" y="249" text-anchor="middle" font-size="8" fill="#a98a4a">工具调用决策</text>
    <rect x="92" y="292" width="176" height="48" rx="8" fill="#eaf1f7" stroke="#bcd0e0"/><text x="180" y="310" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f5a8a">web_search</text><text x="180" y="323" text-anchor="middle" font-size="8.2" fill="#3a6f9c">发现官方与第三方候选页面</text><text x="180" y="335" text-anchor="middle" font-size="8.2" fill="#3a6f9c">① 可发现性 · ⑤ 二手丰富度</text>
    <rect x="92" y="352" width="176" height="48" rx="8" fill="#eaf1f7" stroke="#bcd0e0"/><text x="180" y="372" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f5a8a">web_fetch</text><text x="180" y="388" text-anchor="middle" font-size="8.2" fill="#3a6f9c">读取选中页面的正文</text><text x="180" y="398" text-anchor="middle" font-size="8.2" fill="#3a6f9c">② 可抓取性 · ③ 正文详尽度</text>
    <rect x="412" y="294" width="178" height="56" rx="8" fill="#F1EBF8" stroke="#a98fd0"/><text x="421" y="312" font-size="9.4" font-weight="700" fill="#5a3fa0">模型自带知识（⑦）</text><text x="421" y="327" font-size="8.2" fill="#6a52a8">无需检索的补充证据；</text><text x="421" y="340" font-size="8.2" fill="#9a5a8a">薄弱时也可能填补空缺。</text>
    <rect x="150" y="430" width="200" height="30" rx="8" fill="#f4f5f8" stroke="#d8dae0"/><text x="250" y="450" text-anchor="middle" font-size="10.5" fill="#333">汇总当前证据（回灌）</text>
    <polygon points="250,472 320,502 250,532 180,502" fill="#FCEFC7" stroke="#8a6d1a"/><text x="250" y="499" text-anchor="middle" font-size="9.6" fill="#8a6d1a">④ 证据是否充分？</text><text x="250" y="512" text-anchor="middle" font-size="7.6" fill="#a98a4a">版本清晰 · 可信度 · 成本</text>
    <rect x="172" y="548" width="156" height="30" rx="8" fill="#E3F4EA" stroke="#3a9b6e"/><text x="250" y="567" text-anchor="middle" font-size="10.5" fill="#1f7a52">⑥ 收敛（证据充分）</text>
    <polygon points="470,474 552,502 470,530 388,502" fill="#FFF1D9" stroke="#c79023"/><text x="470" y="499" text-anchor="middle" font-size="9" fill="#9a6a18">能否继续检索？</text><text x="470" y="511" text-anchor="middle" font-size="7.2" fill="#b08a3a">未达上限且预期有效</text>
    <polygon points="470,540 560,568 470,596 380,568" fill="#FBEAD9" stroke="#c0703a"/><text x="470" y="565" text-anchor="middle" font-size="9" fill="#9a4a18">是否仍有可靠证据？</text><text x="470" y="577" text-anchor="middle" font-size="7.2" fill="#b06a3a">官方 / 第三方 / 先验任一充分</text>
    <rect x="130" y="640" width="460" height="58" rx="9" fill="#eef0f3" stroke="#9aa0aa"/><text x="360" y="661" text-anchor="middle" font-size="12" font-weight="700" fill="#3a3f48">终答</text><text x="360" y="677" text-anchor="middle" font-size="8.4" fill="#5a6470">⑨ 版本可锁定性 · ⑩ 步骤可复现性 · ⑪ 综合置信度</text><text x="360" y="690" text-anchor="middle" font-size="8.4" fill="#9a4048">证据不足时，回答应显式暴露边界，而非把缺口伪装成确定性。</text>
    <g fill="none" stroke="#8a8a8a" marker-end="url(#arrow)"><path d="M280,44 V51"/><path d="M280,88 V97"/><path d="M280,126 V133"/><path d="M280,162 V169"/><path d="M280,202 V211"/><path d="M280,264 V280 H180 V292"/><path d="M180,340 V352"/><path d="M180,400 L222,430"/><path d="M501,350 V414 H300 V430"/><path d="M250,460 V471"/></g>
    <path d="M348,238 H500 V294" fill="none" stroke="#8a4fb0" marker-end="url(#arrow)"/><text x="430" y="232" font-size="8.4" fill="#7a4fa0">否：依据模型先验</text>
    <text x="300" y="278" font-size="8.4" fill="#2a7a68">是：调用工具检索</text><text x="190" y="349" font-size="7.8" fill="#3a6f9c">选中 URL</text>
    <path d="M250,532 V548" fill="none" stroke="#3a9b6e" stroke-width="1.3" marker-end="url(#green-arrow)"/><text x="258" y="544" font-size="8.4" fill="#2a7a68">充分</text><path d="M250,578 V640" fill="none" stroke="#3a9b6e" stroke-width="1.3" marker-end="url(#green-arrow)"/>
    <path d="M320,502 H388" fill="none" stroke="#c79023" stroke-width="1.3" marker-end="url(#arrow)"/><text x="338" y="496" font-size="8.4" fill="#9a6a18">不足</text><path d="M552,502 H652 V190 H364" fill="none" stroke="#c79023" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="556" y="366" font-size="8.4" fill="#9a6a18">是：换检索词再搜索</text>
    <path d="M470,530 V540" fill="none" stroke="#c0703a" stroke-width="1.3" marker-end="url(#arrow)"/><text x="478" y="536" font-size="8" fill="#9a4a18">否：检索已穷尽</text><path d="M380,568 H360 V640" fill="none" stroke="#3a9b6e" stroke-width="1.3" marker-end="url(#green-arrow)"/><text x="346" y="604" font-size="8" fill="#2a7a68">有：依据证据作答</text>
    <path d="M470,596 V640" fill="none" stroke="#D0454F" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#red-arrow)"/><text x="486" y="610" font-size="8.2" font-weight="700" fill="#B0212B">无：最高风险</text><text x="486" y="622" font-size="7.8" fill="#A03038">模型无法可靠识别知识缺口，</text><text x="486" y="633" font-size="7.8" fill="#A03038">可能凭记忆填补空缺。</text>
  </g>
</svg>
