<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="790" viewBox="0 0 1040 790" role="img"><title>可观察的 Agent 知识获取循环与测量位置</title><desc>可观察的 Agent 知识获取循环与测量位置</desc>
<rect width="100%" height="100%" fill="white"/>
<rect x="330" y="12" width="340" height="48" rx="6" fill="#edf2f8" stroke="#b6c5d5"/>
<text x="500" y="34" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#243447">任务与记录上下文</text>
<text x="500" y="51" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#243447">目标、初始材料、Agent／工具、时间</text>
<rect x="350" y="88" width="300" height="54" rx="6" fill="#f1ebf8" stroke="#cbbce5"/>
<text x="500" y="111" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#243447">① 解析需求</text>
<text x="500" y="130" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#243447">并拆解子目标</text>
<rect x="350" y="165" width="300" height="54" rx="6" fill="#fff6df" stroke="#e0bd67"/>
<text x="500" y="188" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#243447">② 是否需要</text>
<text x="500" y="207" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#243447">外部证据？</text>
<rect x="70" y="255" width="270" height="64" rx="6" fill="#eaf1f8" stroke="#b4cadd"/>
<text x="205" y="268" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#243447">web_search</text>
<text x="205" y="290" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#243447">发现官方／社区候选来源</text>
<text x="205" y="307" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#426d8e">M1 发现性 · M5 替代覆盖</text>
<rect x="70" y="343" width="270" height="66" rx="6" fill="#eaf1f8" stroke="#b4cadd"/>
<text x="205" y="366" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#243447">③ 选择 URL</text>
<text x="205" y="384" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#243447">记录发布者、来源角色与查询</text>
<text x="205" y="401" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#426d8e">M6 来源可信度</text>
<rect x="70" y="433" width="270" height="64" rx="6" fill="#eaf1f8" stroke="#b4cadd"/>
<text x="205" y="461" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#243447">web_fetch</text>
<text x="205" y="482" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#243447">取得正文、片段或失败状态</text>
<text x="205" y="499" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#426d8e">M2 内容状态 · M3 充分性</text>
<rect x="690" y="288" width="270" height="72" rx="6" fill="#f3edf9" stroke="#cbbce5"/>
<text x="825" y="316" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#243447">模型先验（M7）</text>
<text x="825" y="337" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#243447">单独登记为估计或测试；</text>
<text x="825" y="354" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#243447">不等同于已取得来源</text>
<rect x="365" y="512" width="270" height="50" rx="6" fill="#f5f6f7" stroke="#ccd3da"/>
<text x="500" y="538" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#243447">④ 汇总证据台账</text>
<text x="500" y="555" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#243447">查询、URL、返回内容、成本与缺口（M8）</text>
<rect x="365" y="587" width="270" height="58" rx="6" fill="#fff6df" stroke="#e0bd67"/>
<text x="500" y="611" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#243447">⑤ 评估充分性与</text>
<text x="500" y="630" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#243447">版本适用性</text>
<text x="500" y="641" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#243447">M4、M9、M10</text>
<rect x="700" y="589" width="250" height="58" rx="6" fill="#fff4e8" stroke="#dfaa6e"/>
<text x="825" y="613" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#243447">调整查询并重试</text>
<text x="825" y="632" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#243447">仍有可检索的证据空间</text>
<rect x="300" y="700" width="400" height="60" rx="6" fill="#e9f3ee" stroke="#8fb9a3"/>
<text x="500" y="724" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#243447">⑥ 作答：下一步行动</text>
<text x="500" y="743" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#243447">或明确证据缺口</text>
<text x="500" y="756" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#243447">M11 为可选启发式汇总，不替代剖面</text>
