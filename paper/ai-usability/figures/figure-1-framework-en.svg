<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" role="img" aria-label="Agent evidence cycle for technical knowledge ecosystems">
  <title>Agent evidence cycle for technical knowledge ecosystems</title>
  <desc>Agent 解析开发任务后，可通过搜索与抓取获取官方和第三方资料，或使用Model prior knowledge；随后判断证据是否Adequate，继续检索或基于证据收敛为Final answer。证据耗尽而仍不Adequate时存在凭记忆填补空缺的风险。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a8a"/></marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2a7a68"/></marker>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#D0454F"/></marker>
  </defs>
  <g font-family="Arial, 'Noto Sans CJK SC', sans-serif">
    <rect x="190" y="14" width="180" height="30" rx="8" fill="#f4f5f8" stroke="#d8dae0"/><text x="280" y="34" text-anchor="middle" font-size="12" fill="#333">Development task / user question</text>
    <rect x="170" y="52" width="220" height="36" rx="8" fill="#f4f5f8" stroke="#d8dae0"/><text x="280" y="69" text-anchor="middle" font-size="11" fill="#333">Assemble task context</text><text x="280" y="82" text-anchor="middle" font-size="9" fill="#888">Constraints, history, and current question</text>
    <rect x="205" y="98" width="150" height="28" rx="8" fill="#ECE7F6" stroke="#b9abe0"/><text x="280" y="116" text-anchor="middle" font-size="11" fill="#4a3f9e">1. Interpret intent</text>
    <rect x="205" y="134" width="150" height="28" rx="8" fill="#ECE7F6" stroke="#b9abe0"/><text x="280" y="152" text-anchor="middle" font-size="11" fill="#4a3f9e">2. Decompose subgoals</text>
    <rect x="196" y="170" width="168" height="32" rx="8" fill="#ECE7F6" stroke="#b9abe0"/><text x="280" y="190" text-anchor="middle" font-size="11" fill="#4a3f9e">3. Route: search / fetch / answer</text>
    <polygon points="280,212 348,238 280,264 212,238" fill="#FCEFC7" stroke="#8a6d1a"/><text x="280" y="236" text-anchor="middle" font-size="10" fill="#8a6d1a">Need retrieval?</text><text x="280" y="249" text-anchor="middle" font-size="8" fill="#a98a4a">Tool-use decision</text>
    <rect x="92" y="292" width="176" height="56" rx="8" fill="#eaf1f7" stroke="#bcd0e0"/><text x="180" y="314" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f5a8a">web_search</text><text x="180" y="331" text-anchor="middle" font-size="8.2" fill="#3a6f9c">Discover official / third-party candidates</text><text x="180" y="340" text-anchor="middle" font-size="6.2" fill="#426d8e">M1 Discoverability · M5 Alternative coverage</text>
    <rect x="92" y="360" width="176" height="56" rx="8" fill="#eaf1f7" stroke="#bcd0e0"/><text x="180" y="382" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f5a8a">web_fetch</text><text x="180" y="399" text-anchor="middle" font-size="8.2" fill="#3a6f9c">Retrieve selected page content</text><text x="180" y="408" text-anchor="middle" font-size="6.2" fill="#426d8e">M2 Content acquisition · M3 Content adequacy</text>
    <rect x="412" y="294" width="178" height="64" rx="8" fill="#F1EBF8" stroke="#a98fd0"/><text x="421" y="316" font-size="9.4" font-weight="700" fill="#5a3fa0">Model prior knowledge</text><text x="421" y="333" font-size="8.2" fill="#6a52a8">Supplementary evidence without retrieval;</text><text x="421" y="346" font-size="8.2" fill="#9a5a8a">when weak, it may fill gaps.</text><text x="421" y="351" font-size="6.2" fill="#426d8e">M7 Model-prior assessment</text>
    <rect x="150" y="438" width="200" height="42" rx="8" fill="#f4f5f8" stroke="#d8dae0"/><text x="250" y="458" text-anchor="middle" font-size="10.5" fill="#333">Integrate current evidence (feedback)</text><text x="250" y="473" text-anchor="middle" font-size="6.2" fill="#426d8e">M6 Source credibility · M8 Acquisition effort</text>
    <polygon points="250,490 335,532 250,574 165,532" fill="#FCEFC7" stroke="#8a6d1a"/><text x="250" y="517" text-anchor="middle" font-size="9.6" fill="#8a6d1a">4. Is evidence adequate?</text><text x="250" y="530" text-anchor="middle" font-size="6.2" fill="#426d8e">M4 Version clarity</text><text x="250" y="541" text-anchor="middle" font-size="6.2" fill="#426d8e">M9 Instruction version specificity</text><text x="250" y="552" text-anchor="middle" font-size="6.2" fill="#426d8e">M10 Instruction completeness</text>
    <rect x="172" y="592" width="156" height="36" rx="8" fill="#E3F4EA" stroke="#3a9b6e"/><text x="250" y="615" text-anchor="middle" font-size="10.5" fill="#1f7a52">6. Converge (evidence adequate)</text>
    <polygon points="470,490 570,532 470,574 370,532" fill="#FFF1D9" stroke="#c79023"/><text x="470" y="527" text-anchor="middle" font-size="9" fill="#9a6a18">Can retrieval continue?</text><text x="470" y="541" text-anchor="middle" font-size="7.2" fill="#b08a3a">Below limit and expected to help</text>
    <polygon points="470,590 575,625 470,660 365,625" fill="#FBEAD9" stroke="#c0703a"/><text x="470" y="622" text-anchor="middle" font-size="9" fill="#9a4a18">Any reliable evidence left?</text><text x="470" y="636" text-anchor="middle" font-size="7.2" fill="#b06a3a">Official / third-party / prior: any adequate</text>
    <rect x="130" y="700" width="460" height="58" rx="9" fill="#eef0f3" stroke="#9aa0aa"/><text x="360" y="721" text-anchor="middle" font-size="12" font-weight="700" fill="#3a3f48">Final answer</text><text x="360" y="737" text-anchor="middle" font-size="6.2" fill="#426d8e">M11 Heuristic summary</text><text x="360" y="750" text-anchor="middle" font-size="8.4" fill="#9a4048">When evidence is insufficient, state the boundary rather than disguise gaps as certainty.</text>
    <g fill="none" stroke="#8a8a8a" marker-end="url(#arrow)"><path d="M280,44 V51"/><path d="M280,88 V97"/><path d="M280,126 V133"/><path d="M280,162 V169"/><path d="M280,202 V211"/><path d="M280,264 V280 H180 V292"/><path d="M180,348 V360"/><path d="M180,416 V427 H250 V438"/><path d="M501,358 V427 H300 V438"/><path d="M250,480 V489"/></g>
    <path d="M348,238 H500 V294" fill="none" stroke="#8a4fb0" marker-end="url(#arrow)"/><text x="430" y="232" font-size="8.4" fill="#7a4fa0">No: use model prior</text>
    <text x="300" y="278" font-size="8.4" fill="#2a7a68">Yes: call retrieval tools</text><text x="190" y="357" font-size="7.8" fill="#3a6f9c">Select URL</text>
    <path d="M250,574 V592" fill="none" stroke="#3a9b6e" stroke-width="1.3" marker-end="url(#green-arrow)"/><text x="258" y="586" font-size="8.4" fill="#2a7a68">Adequate</text><path d="M250,628 V700" fill="none" stroke="#3a9b6e" stroke-width="1.3" marker-end="url(#green-arrow)"/>
    <path d="M335,532 H370" fill="none" stroke="#c79023" stroke-width="1.3" marker-end="url(#arrow)"/><text x="351" y="526" font-size="8.4" fill="#9a6a18">Insufficient</text><path d="M570,532 H652 V190 H364" fill="none" stroke="#c79023" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="556" y="390" font-size="8.4" fill="#9a6a18">Yes: refine and search again</text>
    <path d="M470,574 V590" fill="none" stroke="#c0703a" stroke-width="1.3" marker-end="url(#arrow)"/><text x="478" y="585" font-size="8" fill="#9a4a18">No: retrieval exhausted</text><path d="M365,625 H360 V700" fill="none" stroke="#3a9b6e" stroke-width="1.3" marker-end="url(#green-arrow)"/><text x="346" y="670" font-size="8" fill="#2a7a68">Yes: answer from evidence</text>
    <path d="M470,660 V700" fill="none" stroke="#D0454F" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#red-arrow)"/><text x="486" y="674" font-size="8.2" font-weight="700" fill="#B0212B">No: highest risk</text><text x="486" y="686" font-size="7.8" fill="#A03038">The model may not reliably detect a knowledge gap,</text><text x="486" y="697" font-size="7.8" fill="#A03038">and may fill it from memory.</text>
    <path d="M280,282 H300 V388 H268" fill="none" stroke="#9aa0aa" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text x="305" y="342" font-size="7.6" fill="#8a8a8a">Known URL: fetch directly</text>
  </g>
</svg>
