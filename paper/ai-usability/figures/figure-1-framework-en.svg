<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img"><title>Observable Agent acquisition loop and measurement locations</title><desc>Observable Agent acquisition loop and measurement locations</desc>
