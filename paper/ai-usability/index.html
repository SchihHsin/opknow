<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Availability for AI</title>
  <style>
    :root{color-scheme:light;--ink:#24313d;--muted:#536574;--line:#dce3e7;--accent:#176253;--paper:#f0f3f5}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
    .bar{position:fixed;top:0;left:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:22px;min-height:64px;width:100%;padding:12px clamp(20px,5vw,72px);background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);transition:transform .22s ease,opacity .16s ease}
    .brand{min-width:0}.title{font:600 15px/1.35 Georgia,"Noto Serif CJK SC",serif}.authors,.affiliation{margin-top:3px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.authors sup{font:700 10px/1 system-ui;vertical-align:super}
    [role="tablist"]{display:flex;gap:6px;flex:none}.tab{border:1px solid transparent;border-radius:999px;background:transparent;color:var(--muted);padding:7px 13px;font:600 13px/1 system-ui;cursor:pointer}.tab[aria-selected="true"]{border-color:#b7d1ca;background:#eaf3ef;color:#134c42}.tab:focus-visible{outline:3px solid #9bc7bb;outline-offset:2px}
    main{padding-top:64px;transition:padding-top .22s ease}.panel{display:none;min-height:calc(100vh - 64px)}.panel.active{display:block}.reader{display:block;border:0;width:100%;height:calc(100vh - 64px);background:var(--paper)}
    body.reader-scrolled .bar{transform:translateY(-100%);opacity:0;pointer-events:none}body.reader-scrolled main{padding-top:0}body.reader-scrolled .panel{min-height:100vh}body.reader-scrolled .reader{height:100vh}
    @media(max-width:620px){.bar{align-items:flex-start;gap:12px;flex-direction:column}.reader{height:calc(100vh - 105px)}.panel{min-height:calc(100vh - 105px)}main{padding-top:105px}body.reader-scrolled .reader{height:100vh}body.reader-scrolled .panel{min-height:100vh}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <div class="title" id="reader-title">AI 能找到开发者所需的知识吗？开发者生态中面向 AI 的知识可得性的定义与度量</div>
      <div class="authors">时昕昱　·　闫浩<sup>*</sup>　·　张敬文</div>
      <div class="affiliation">Huawei Technologies (China)　·　* Corresponding author</div>
    </div>
    <div role="tablist" aria-label="论文语言">
      <button class="tab" id="tab-cn" role="tab" aria-selected="true" aria-controls="panel-cn">中文</button>
      <button class="tab" id="tab-en" role="tab" aria-selected="false" aria-controls="panel-en">English</button>
    </div>
  </header>
  <main>
    <section class="panel active" id="panel-cn" role="tabpanel" aria-labelledby="tab-cn"><iframe class="reader" title="中文论文" src="manuscript-cn-v0.2.html"></iframe></section>
    <section class="panel" id="panel-en" role="tabpanel" aria-labelledby="tab-en"><iframe class="reader" title="English manuscript" data-src="manuscript-en-v0.2.html"></iframe></section>
  </main>
  <script>
    const tabs=[...document.querySelectorAll('[role="tab"]')];
    const titles={
      cn:'AI 能找到开发者所需的知识吗？开发者生态中面向 AI 的知识可得性的定义与度量',
      en:'Can AI Find What Developers Need? Defining and Measuring Knowledge Availability for AI in Developer Ecosystems'
    };
    function watchScroll(frame){
      frame.addEventListener('load',()=>{
        const frameWindow=frame.contentWindow;
        const update=()=>document.body.classList.toggle('reader-scrolled',frameWindow.scrollY>8);
        frameWindow.addEventListener('scroll',update,{passive:true});
        update();
      },{once:true});
    }
    function select(lang){
      tabs.forEach(tab=>{const active=tab.id===`tab-${lang}`;tab.setAttribute('aria-selected',active);document.getElementById(`panel-${tab.id.slice(-2)}`).classList.toggle('active',active)});
      const frame=document.querySelector(`#panel-${lang} iframe`);if(!frame.getAttribute('src')){watchScroll(frame);frame.src=frame.dataset.src;}
      else document.body.classList.toggle('reader-scrolled',frame.contentWindow.scrollY>8);
      document.getElementById('reader-title').textContent=titles[lang];
      history.replaceState(null,'',`#${lang}`);
    }
    const firstFrame=document.querySelector('#panel-cn iframe');watchScroll(firstFrame);
    tabs.forEach(tab=>tab.addEventListener('click',()=>select(tab.id.slice(-2))));
    select(location.hash==='#en'?'en':'cn');
  </script>
</body>
</html>
